---
# OpenShift Virtualization health check.
#
# Targets the cluster pointed to by the current KUBECONFIG (or
# ~/.kube/config), one cluster per run. Run it again with a different
# KUBECONFIG to check another cluster in the fleet.
#
# Each check is its own role under roles/check_*, selectable by tag.
# Every role appends its result (PASS/FAIL/WARN + data) to the
# healthcheck_results list; the final play writes that list to a
# per-cluster JSON report and prints the PASS/FAIL/WARN summary.
#
# Usage:
#   KUBECONFIG=/path/to/cluster.kubeconfig ansible-playbook site.yaml
#   KUBECONFIG=/path/to/cluster.kubeconfig K8S_AUTH_API_TOKEN=sha256~... ansible-playbook site.yaml
#   ansible-playbook site.yaml -e k8s_auth_kubeconfig=/path/to/cluster.kubeconfig -e k8s_auth_api_token=sha256~...
#   ansible-playbook site.yaml --tags check_hco_status

- name: OpenShift Virtualization health check
  hosts: localhost
  gather_facts: false
  vars:
    healthcheck_results: []

  pre_tasks:
    - name: Resolve cluster identity for this run
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_auth_kubeconfig | default(omit) }}"
        api_token: "{{ k8s_auth_api_token | default(omit) }}"
        api_version: config.openshift.io/v1
        kind: ClusterVersion
        name: version
      register: _clusterversion
      ignore_errors: true

    - name: Set cluster identifier used in report filenames
      ansible.builtin.set_fact:
        healthcheck_cluster_id: >-
          {{ (_clusterversion.resources[0].spec.clusterID
              | default(lookup('env', 'KUBECONFIG') | default('unknown-cluster', true)))
             | regex_replace('[^A-Za-z0-9_.-]', '_') }}
        healthcheck_timestamp: "{{ '%Y%m%dT%H%M%SZ' | strftime }}"

  roles:
    - role: check_clusterversion
      tags: [check_clusterversion]
    - role: check_clusteroperators
      tags: [check_clusteroperators]
    - role: check_mcp_status
      tags: [check_mcp_status]
    - role: check_nodes_mcp_render
      tags: [check_nodes_mcp_render]
    - role: check_machinesets
      tags: [check_machinesets]
    - role: check_baremetalhosts
      tags: [check_baremetalhosts]
    - role: check_hco_status
      tags: [check_hco_status]
    - role: check_kubevirt_components
      tags: [check_kubevirt_components]
    - role: check_cdi_storage
      tags: [check_cdi_storage]
    - role: check_vm_health
      tags: [check_vm_health]
    - role: check_vm_networking
      tags: [check_vm_networking]
    - role: check_live_migration
      tags: [check_live_migration]

  post_tasks:
    - name: Ensure report directory exists
      ansible.builtin.file:
        path: "{{ healthcheck_report_dir }}"
        state: directory
        mode: "0755"

    - name: Write per-cluster JSON report
      ansible.builtin.copy:
        dest: "{{ healthcheck_report_dir }}/{{ healthcheck_cluster_id }}-{{ healthcheck_timestamp }}.json"
        content: "{{ { 'cluster_id': healthcheck_cluster_id, 'timestamp': healthcheck_timestamp, 'checks': healthcheck_results } | to_nice_json }}"
        mode: "0644"

    - name: Print health check summary
      ansible.builtin.debug:
        msg: >-
          [{{ item.status }}] {{ item.check }}: {{ item.message }}
      loop: "{{ healthcheck_results }}"
      loop_control:
        label: "{{ item.check }}"
