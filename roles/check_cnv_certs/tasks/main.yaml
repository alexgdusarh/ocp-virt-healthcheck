---
# Check: CNV internal certificates (TLS handshake / trust diagnostics)
#
# KubeVirt runs its own self-signed CA (not cert-manager) for internal
# mTLS between virt-api/virt-controller/virt-handler, in Secrets
# kubevirt-ca / kubevirt-virt-handler-certs / kubevirt-virt-handler-
# server-certs / kubevirt-virt-api-certs / kubevirt-controller-certs
# (namespace openshift-cnv). Server certs default to a 24h lifetime -
# a stuck rotation becomes a real outage within ~24h.
#
# Actual X.509 expiry-date parsing requires openssl and stays an
# oc-script-only capability (same split as check 20's etcdctl) - this
# role checks Secret existence, that the virt-handler DaemonSet
# actually mounts kubevirt-virt-handler-certs (a documented real
# failure signature: "failed to load the certificate
# /etc/virt-handler/clientcertificates/..." is a MOUNT defect, not a
# trust-chain problem), and greps virt-handler pod logs for known
# TLS/x509 error strings.
#
# IMPORTANT - "failed to load the certificate ... private key does
# not match public key" is NOT by itself evidence of a broken cert.
# Verified against real client must-gather data: every KubeVirt
# component's cert watcher (cert-manager.go) hits this on a steady
# ~12h cadence (observed clustering around :27/:28 past the hour,
# twice daily) across virt-handler AND virt-controller, for multiple
# independent Secrets (server, client, exportca) - a torn read of the
# projected Secret volume during the watcher's periodic reload, not a
# persisted bad keypair.
#
# CORRECTED (real-world RCA from the client engagement, confirmed
# directly against the live cluster): checking whether the error is
# still the LAST matching line in the log tail is NOT a reliable
# self-clear signal, and produced a false CRITICAL in a real run.
# virt-handler does not log a positive "cert reloaded OK" confirmation
# on success, so a benign occurrence that recovered within the same
# second looks IDENTICAL in the log tail to one that never recovered.
# The client's RCA used the actual correct signal: pod restart count
# and current Running/Ready state. Zero restarts correlated with the
# error timestamps, and the pod stayed Running/Ready throughout -
# meaning TLS availability was never actually interrupted, because
# rotation completes well before the old cert expires. This role now
# checks THAT signal (restartCount + Running/Ready), not log-tail
# position.

- name: "check_cnv_certs | Get CNV cert Secrets"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_auth_kubeconfig | default(omit) }}"
    api_token: "{{ k8s_auth_api_token | default(omit) }}"
    kind: Secret
    namespace: "{{ cnv_namespace | default('openshift-cnv') }}"
  register: _cnv_all_secrets
  ignore_errors: true

- name: "check_cnv_certs | Get virt-handler DaemonSet"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_auth_kubeconfig | default(omit) }}"
    api_token: "{{ k8s_auth_api_token | default(omit) }}"
    api_version: apps/v1
    kind: DaemonSet
    name: virt-handler
    namespace: "{{ cnv_namespace | default('openshift-cnv') }}"
  register: _vh_daemonset
  ignore_errors: true

- name: "check_cnv_certs | Get virt-handler Pods"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_auth_kubeconfig | default(omit) }}"
    api_token: "{{ k8s_auth_api_token | default(omit) }}"
    kind: Pod
    namespace: "{{ cnv_namespace | default('openshift-cnv') }}"
    label_selectors:
      - "kubevirt.io=virt-handler"
  register: _vh_pods
  ignore_errors: true

- name: "check_cnv_certs | Reset accumulators"
  ansible.builtin.set_fact:
    _cert_problems: []
    _expected_cert_secrets: ['kubevirt-ca', 'kubevirt-virt-handler-certs', 'kubevirt-virt-handler-server-certs', 'kubevirt-virt-api-certs', 'kubevirt-controller-certs']
    _existing_secret_names: "{{ (_cnv_all_secrets.resources | default([])) | map(attribute='metadata.name') | list }}"

- name: "check_cnv_certs | Flag missing expected cert Secrets"
  ansible.builtin.set_fact:
    _cert_problems: "{{ _cert_problems + ['Secret ' ~ item ~ ' not found in ' ~ (cnv_namespace | default('openshift-cnv'))] }}"
  loop: "{{ _expected_cert_secrets }}"
  loop_control:
    label: "{{ item }}"
  when: >-
    (item not in _existing_secret_names)
    and ((_cnv_all_secrets.resources | default([]) | length) > 0)

- name: "check_cnv_certs | Check virt-handler DaemonSet mounts kubevirt-virt-handler-certs"
  ansible.builtin.set_fact:
    _vh_mounts_certs: >-
      {{
        ((_vh_daemonset.resources | default([]) | first | default({})).spec.template.spec.volumes | default([]))
        | selectattr('secret.secretName', 'defined')
        | selectattr('secret.secretName', 'equalto', 'kubevirt-virt-handler-certs')
        | list | length > 0
      }}

- name: "check_cnv_certs | Flag virt-handler not mounting its cert Secret"
  ansible.builtin.set_fact:
    _cert_problems: "{{ _cert_problems + ['virt-handler DaemonSet does not mount kubevirt-virt-handler-certs - matches the documented \"failed to load the certificate\" mount-defect signature'] }}"
  when: >-
    not _vh_mounts_certs
    and ((_vh_daemonset.resources | default([]) | length) > 0)

- name: "check_cnv_certs | Fetch virt-handler pod logs (tail, for TLS/x509 error grep)"
  kubernetes.core.k8s_log:
    kubeconfig: "{{ k8s_auth_kubeconfig | default(omit) }}"
    api_token: "{{ k8s_auth_api_token | default(omit) }}"
    namespace: "{{ cnv_namespace | default('openshift-cnv') }}"
    name: "{{ item.metadata.name }}"
    tail_lines: 500
  register: _vh_log_results
  loop: "{{ _vh_pods.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  ignore_errors: true

- name: "check_cnv_certs | Flag virt-handler pods with sustained TLS/x509 trust errors in recent logs"
  vars:
    _log_text: "{{ item.log | default('') }}"
  ansible.builtin.set_fact:
    _cert_problems: "{{ _cert_problems + [(item.item.metadata.name | default('unknown')) ~ ': TLS/x509 trust error found in logs'] }}"
  loop: "{{ _vh_log_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.metadata.name | default('unknown') }}"
  when: >-
    not (item.failed | default(false))
    and (_log_text is search('x509:|tls: bad certificate|tls: handshake failure|certificate signed by unknown authority|certificate has expired|remote error: tls', ignorecase=True))

- name: "check_cnv_certs | Reset cert-mismatch accumulators"
  ansible.builtin.set_fact:
    _cert_benign_notes: []

- name: "check_cnv_certs | Flag pods with a cert/key mismatch NOT cleanly Running/Ready with zero restarts (CRITICAL)"
  # Correlation signal, not tail-position: a mismatch occurrence is
  # benign when the pod is currently Running/Ready with zero container
  # restarts (matches the client RCA: the pod never actually lost TLS
  # availability). A pod that DID restart, or is not currently
  # Running/Ready, needs the restart's finishedAt timestamp manually
  # correlated against the mismatch occurrences before ruling it
  # benign - flag it rather than silently assume either way.
  vars:
    _log_text: "{{ item.log | default('') }}"
    _mismatch_count: "{{ _log_text | regex_findall('does not match public key') | length }}"
    _pod_resource: "{{ (_vh_pods.resources | default([])) | selectattr('metadata.name', 'equalto', item.item.metadata.name) | first | default({}) }}"
    _container_status: "{{ (_pod_resource.status.containerStatuses | default([])) | selectattr('name', 'equalto', 'virt-handler') | first | default({}) }}"
    _restart_count: "{{ _container_status.restartCount | default(-1) }}"
    _is_ready: "{{ _container_status.ready | default(false) }}"
    _phase: "{{ _pod_resource.status.phase | default('Unknown') }}"
  ansible.builtin.set_fact:
    _cert_problems: "{{ _cert_problems + [(item.item.metadata.name | default('unknown')) ~ ': ' ~ (_mismatch_count | string) ~ ' certificate/key mismatch occurrence(s) in recent logs, but pod is NOT cleanly Running/Ready with zero restarts (phase=' ~ _phase ~ ', ready=' ~ (_is_ready | string) ~ ', restartCount=' ~ (_restart_count | string) ~ ') - correlate restart timestamp against mismatch occurrences before ruling benign'] }}"
  loop: "{{ _vh_log_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.metadata.name | default('unknown') }}"
  when: >-
    not (item.failed | default(false))
    and (_mismatch_count | int > 0)
    and not (_phase == 'Running' and _is_ready and (_restart_count | int) == 0)

- name: "check_cnv_certs | Note benign cert/key mismatch occurrences (pod Running/Ready, zero restarts - INFO only)"
  vars:
    _log_text: "{{ item.log | default('') }}"
    _mismatch_count: "{{ _log_text | regex_findall('does not match public key') | length }}"
    _pod_resource: "{{ (_vh_pods.resources | default([])) | selectattr('metadata.name', 'equalto', item.item.metadata.name) | first | default({}) }}"
    _container_status: "{{ (_pod_resource.status.containerStatuses | default([])) | selectattr('name', 'equalto', 'virt-handler') | first | default({}) }}"
    _restart_count: "{{ _container_status.restartCount | default(-1) }}"
    _is_ready: "{{ _container_status.ready | default(false) }}"
    _phase: "{{ _pod_resource.status.phase | default('Unknown') }}"
  ansible.builtin.set_fact:
    _cert_benign_notes: "{{ _cert_benign_notes + [(item.item.metadata.name | default('unknown')) ~ ': ' ~ (_mismatch_count | string) ~ ' benign cert-reload-race occurrence(s) (pod Running/Ready, zero restarts - TLS availability never interrupted)'] }}"
  loop: "{{ _vh_log_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.metadata.name | default('unknown') }}"
  when: >-
    not (item.failed | default(false))
    and (_mismatch_count | int > 0)
    and (_phase == 'Running' and _is_ready and (_restart_count | int) == 0)

- name: "check_cnv_certs | Read cluster-wide Proxy config (heuristic context only, not a confirmed CNV failure mode)"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_auth_kubeconfig | default(omit) }}"
    api_token: "{{ k8s_auth_api_token | default(omit) }}"
    api_version: config.openshift.io/v1
    kind: Proxy
    name: cluster
  register: _cluster_proxy
  ignore_errors: true

- name: "check_cnv_certs | Determine if a cluster-wide proxy is configured (informational)"
  vars:
    _proxy_spec: "{{ (_cluster_proxy.resources | default([]) | first | default({})).spec | default({}) }}"
  ansible.builtin.set_fact:
    _proxy_configured: "{{ (_proxy_spec.httpProxy | default('')) != '' or (_proxy_spec.httpsProxy | default('')) != '' }}"
    _proxy_no_proxy: "{{ (_cluster_proxy.resources | default([]) | first | default({})).status.noProxy | default('') }}"

- name: "check_cnv_certs | Finalize result"
  ansible.builtin.set_fact:
    _cnv_certs_result:
      check: check_cnv_certs
      status: >-
        {{ 'CRITICAL' if (_cert_problems | length > 0) else 'OK' }}
      message: >-
        {%- if _cert_problems | length > 0 -%}
        {{ _cert_problems | length }} problem(s) found: {{ _cert_problems | join('; ') }}
        {%- else -%}
        all expected CNV cert Secrets present, virt-handler mounts its cert Secret, no TLS/x509 error strings found in recent virt-handler logs
        {%- endif -%}
        {{ (' Benign cert-reload-race occurrences noted (Running/Ready, zero restarts, TLS never interrupted): ' ~ (_cert_benign_notes | join('; ')) ~ '.') if (_cert_benign_notes | default([]) | length > 0) else '' }}
        {{ (' NOTE: cluster-wide proxy IS configured (noProxy=' ~ _proxy_no_proxy ~ ') - if virt-handler TLS errors persist, verify in-cluster traffic (*.pod.cluster.local/*.svc) is actually excluded from proxying (heuristic, not a confirmed documented CNV failure mode).') if _proxy_configured else '' }}
      data:
        existing_secrets: "{{ _existing_secret_names }}"
        virt_handler_mounts_certs: "{{ _vh_mounts_certs }}"
        proxy_configured: "{{ _proxy_configured }}"
        proxy_no_proxy: "{{ _proxy_no_proxy }}"
        problems: "{{ _cert_problems }}"
        benign_cert_reload_occurrences: "{{ _cert_benign_notes | default([]) }}"

- name: "check_cnv_certs | Record result"
  ansible.builtin.set_fact:
    healthcheck_results: "{{ healthcheck_results + [_cnv_certs_result] }}"

- name: "check_cnv_certs | Show result"
  ansible.builtin.debug:
    var: _cnv_certs_result
